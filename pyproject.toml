[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "centriq"
version = "0.1.0"
description = "Calibration-free centering quantizer"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
